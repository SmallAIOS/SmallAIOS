# SmallAIOS boot configuration for U-Boot extlinux
# Note: "LINUX" is an extlinux keyword meaning "kernel image to load" —
# it does not imply the OS is Linux. SmallAIOS uses the ARM64 Image
# header format for U-Boot compatibility.
TIMEOUT 30
DEFAULT primary

LABEL primary
  MENU LABEL SmallAIOS
  LINUX /boot/Image
  FDT /boot/tegra210-smallaios.dtb
  APPEND console=tty0 console=ttyS0,115200n8
