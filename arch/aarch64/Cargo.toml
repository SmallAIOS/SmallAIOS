[package]
name = "smallaios-arch-aarch64"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SmallAIOS AArch64 architecture HAL: boot, GICv2/v3, paging, SVE, Tegra X1, Tegra234"
publish = false

[lib]
name = "smallaios_arch_aarch64"
path = "src/lib.rs"

[[bin]]
name = "smallaios-aarch64"
path = "src/main.rs"

# UEFI bin for Jetson Orin family. Built via `just build-kernel-uefi`
# (target `aarch64-unknown-uefi`, `--features tegra234`). `required-features`
# means cargo silently skips this bin on default `cargo build` invocations
# without `--features tegra234`, so existing CI jobs that don't opt in
# stay unaffected.
[[bin]]
name = "smallaios-uefi"
path = "src/main_uefi.rs"
required-features = ["tegra234"]

[features]
default = ["qemu-virt"]
qemu-virt = []
# Tegra X1 (Cortex-A57, GICv2, NS16550A) — Jetson Nano. Userspace CUDA path
# lives in `arch/nvidia` under its own `tegra-orin` feature flag.
tegra-x1 = ["smallaios-onnx-rt", "smallaios-arch-nvidia"]
# Tegra234 (Cortex-A78AE, GICv3, TCU UART) — Jetson Orin family.
# Initially empty: the feature exists so `lib.rs` can `cfg`-gate the
# Phase 2 modules (boot_uefi, tegra234_uart, gicv3) added by subsequent
# sub-PRs of `unikernel-orin-bringup-v1`. Distinct from `arch/nvidia`'s
# `tegra-orin` (Orin userspace CUDA) by design.
tegra234 = []

[dependencies]
smallaios-kernel = { path = "../../kernel" }
smallaios-onnx-rt = { path = "../../onnx-rt", optional = true, default-features = false, features = ["cpu"] }
smallaios-arch-nvidia = { path = "../nvidia", optional = true, default-features = false, features = ["tegra"] }
