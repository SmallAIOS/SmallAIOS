\* TLC Model Checker Configuration for IQ Sample Ring Buffer

CONSTANTS
    BufSize = 4

SPECIFICATION Spec

INVARIANTS
    TypeInvariant
    ReaderNeverReadsGarbage
    OverflowBounded
    IndicesInBounds
    NoPartialReads
    ReadNeverExceedsWrite
    SlotAccountingInvariant
    AtMostOneWriting

\* EventualProgress is a liveness property; omit under bounded checking
