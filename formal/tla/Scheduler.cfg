\* TLC Model Checker Configuration for Scheduler
\* Use small values for bounded model checking

CONSTANTS
    SystemTasks = {s1}
    IpcTasks = {i1}
    InferenceTasks = {f1, f2}
    MaxSteps = 12
    WatchdogTimeout = 5

SPECIFICATION Spec

INVARIANTS
    TypeInvariant
    MutualExclusion
    NoPriorityInversion
    WatchdogAlive

PROPERTIES
    SystemTasksRun
    IpcTasksRun
    WatchdogServiced
