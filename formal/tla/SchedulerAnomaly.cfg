\* TLC Model Checker Configuration for SchedulerAnomaly
\* Use small values for bounded model checking

CONSTANTS
    SystemTasks = {s1}
    IpcTasks = {i1}
    InferenceTasks = {f1}
    MaxSteps = 10
    WatchdogTimeout = 5
    DenialThreshold = 3
    LatencyThreshold = 5

SPECIFICATION Spec

INVARIANTS
    TypeInvariant
    MutualExclusion
    AlertsBounded
    DenialCountBounded
    ThresholdCorrectness
    SuppressionEffective
