# Pre-commit hooks for SmallAIOS
# Install: pre-commit install  (or: just setup-hooks for native git hooks)
# Run all: pre-commit run --all-files
#
# Native git hooks at .githooks/pre-commit run the same checks without
# requiring the pre-commit Python tool. Use whichever you prefer.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --exclude smallaios-arch-x86_64 --exclude smallaios-arch-aarch64 --exclude smallaios-arch-riscv64 -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-audit
        name: cargo audit (CVE check)
        entry: bash -c 'command -v cargo-audit >/dev/null 2>&1 && cargo audit --quiet || echo "cargo-audit not installed, skipping"'
        language: system
        pass_filenames: false
        files: '(Cargo\.(toml|lock))$'
        verbose: true

      - id: cargo-geiger
        name: cargo geiger (unsafe audit)
        entry: bash -c 'command -v cargo-geiger >/dev/null 2>&1 && cargo geiger --output-format ascii --update-readme=false 2>/dev/null | tail -5 || echo "cargo-geiger not installed, skipping"'
        language: system
        pass_filenames: false
        types: [rust]
        verbose: true

      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        pass_filenames: false
        files: '(Cargo\.(toml|lock)|deny\.toml)$'

      - id: check-cycles
        name: check cyclic dependencies
        entry: ./scripts/check-cycles.sh
        language: system
        pass_filenames: false
        files: 'Cargo\.toml$'

      - id: module-cycles
        name: check module-level cycles (advisory)
        entry: bash -c 'command -v cargo-modules >/dev/null 2>&1 && just arch-check || echo "cargo-modules not installed, skipping"'
        language: system
        pass_filenames: false
        files: '\.rs$'
        verbose: true
