name: "SmallAIOS CodeQL Configuration"

# This configuration is consumed by the workflow-driven CodeQL setup in
# .github/workflows/codeql.yml. The workflow passes `config-file:` to
# `github/codeql-action/init`, which then honors the directives below.
#
# See openspec/changes/codeql-quality-cleanup-v1/ for the policy that drives
# these entries (capability `codeql-suppression-policy`). When a CodeQL false
# positive surfaces:
#   1. Prefer the test-vector module convention. Move literal byte arrays
#      into a sibling `*_test_vectors.rs` (or `test_vectors/<topic>.rs`).
#      The `paths-ignore` glob below covers those modules automatically.
#   2. Reserve any future targeted query-filter for irreducible
#      production-code false positives — and document the rationale here
#      and at the call site.

# ────────────────────────────────────────────────────────────────────────────
# Path filters
# ────────────────────────────────────────────────────────────────────────────
#
# Files matching these globs are excluded from analysis entirely. Reserved
# for modules whose only contents are known-answer-test (KAT) vectors or
# other reference fixtures. Byte-array constants in these files would
# otherwise re-fire `rust/hard-coded-cryptographic-value` on every scan.
paths-ignore:
  - "**/*_test_vectors.rs"
  - "**/test_vectors/**"

# ────────────────────────────────────────────────────────────────────────────
# Query filters — production-code irreducible false positives
# ────────────────────────────────────────────────────────────────────────────
#
# Per the suppression-policy step (2) — when a false positive surfaces in
# production code (NOT a test fixture, so the `_test_vectors.rs` convention
# doesn't apply), exclude `rust/hard-coded-cryptographic-value` for the
# specific file. Each entry below lists the file, the irreducible
# constants that fire the rule, and the spec/RFC reference proving they
# are not secret material.
#
# - `security/src/argon2id.rs`
#     The `b64_decode` helper inside `Argon2id::format_phc` contains the
#     RFC 4648 §5 base64 alphabet (`b'A'..=b'Z'`, `b'a'..=b'z'`,
#     `b'0'..=b'9'`, `b'+' => 62`, `b'/' => 63`) and an offset constant
#     stack (26, 52, 62, 63). The alphabet is a public encoding, not a
#     cryptographic secret. Documentation comments + production code at
#     lines ~840-915 trigger the rule despite their inline `// lgtm[...]`
#     suppressions, which the Rust analyzer doesn't honor for this rule.
#
# - `kernel/src/syscall/auth.rs`
#     The `DUMMY_PHC` constant + per-handler `[0u8; 16]` salt buffers in
#     `handle_auth_change_password` and `handle_auth_create_user` are
#     production-code constants used either as a constant-time-equivalent
#     reject path (DUMMY_PHC: `management-login-v1` Q9 anti-enumeration)
#     or as fresh-CSPRNG-source buffers (salt: filled by the kernel
#     CSPRNG immediately after declaration). Neither is a secret.
#
# - `tls-client/src/handshake/key_schedule.rs`
#     The TLS 1.3 key schedule (RFC 8446 §7.1) zero-initialises
#     fixed-size output buffers that HKDF-Expand-Label fills before any
#     use (`Secret::new`'s `[0u8; MAX_HASH_LEN]`, `traffic_keys`'
#     `key`/`iv` arrays — flagged as "salt"/"nonce"), and §7.1 itself
#     mandates literal zero inputs at two schedule points (zero IKM for
#     the Early Secret and Master Secret extracts). Same
#     filled-immediately-after-declaration pattern as the
#     `kernel/src/syscall/auth.rs` salt buffers above. Production code,
#     so the `_test_vectors.rs` convention does not apply.
#
# Adding a new entry MUST cite (a) the file, (b) the spec/RFC section that
# governs the constant, and (c) why moving to a `_test_vectors.rs` sibling
# is not applicable.
query-filters:
  - exclude:
      id: rust/hard-coded-cryptographic-value
      paths:
        - security/src/argon2id.rs
        - kernel/src/syscall/auth.rs
        - tls-client/src/handshake/key_schedule.rs
