name: SmallAIOS CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  BUILD_STD: "-Z build-std=core,compiler_builtins,alloc -Z build-std-features=compiler-builtins-mem"

jobs:
  check-format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: clippy, rust-src
      - run: >-
          cargo clippy
          -p smallaios-kernel
          -p smallaios-security
          -p smallaios-onnx-rt
          -p smallaios-ipc
          -p smallaios-net
          -p smallaios-posix
          -p smallaios-container
          -- -D warnings

  build-x86_64:
    name: Build x86-64 Kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none
      - run: cargo build --target x86_64-unknown-none -p smallaios-arch-x86_64 $BUILD_STD

  build-aarch64:
    name: Build AArch64 Kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: aarch64-unknown-none
      - run: cargo build --target aarch64-unknown-none -p smallaios-arch-aarch64 $BUILD_STD

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - run: >-
          cargo test
          -p smallaios-kernel
          -p smallaios-security
          -p smallaios-onnx-rt
          -p smallaios-ipc
          -p smallaios-net
          -p smallaios-posix
          -p smallaios-container

  formal-verification:
    name: Formal Verification (TLA+)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'safety-critical')
    steps:
      - uses: actions/checkout@v4
      - name: Install TLA+ tools
        run: |
          sudo apt-get update && sudo apt-get install -y default-jre
          wget -q https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar -O /tmp/tla2tools.jar
      - name: Check TLA+ models
        run: |
          for cfg in formal/tla/*.cfg; do
            model=$(basename "$cfg" .cfg)
            echo "Checking $model..."
            java -cp /tmp/tla2tools.jar tlc2.TLC \
              -config "$cfg" \
              -workers auto \
              "formal/tla/${model}.tla" || exit 1
          done

  change-gates:
    name: Change Gates
    runs-on: ubuntu-latest
    needs: [check-format, clippy, test, build-x86_64, build-aarch64]
    if: github.event_name == 'pull_request'
    steps:
      - name: All gates passed
        run: echo "All change gates passed — PR is mergeable"
