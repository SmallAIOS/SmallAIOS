name: SmallAIOS CI

on:
  push:
    branches: [main, develop, "claude/**", "change/**"]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  BUILD_STD: "-Z build-std=core,compiler_builtins,alloc -Z build-std-features=compiler-builtins-mem"

jobs:
  check-format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: clippy, rust-src
      - run: >-
          cargo clippy
          -p smallaios-kernel
          -p smallaios-security
          -p smallaios-onnx-rt
          -p smallaios-ipc
          -p smallaios-net
          -p smallaios-posix
          -p smallaios-container
          -p smallaios-bus
          -p smallaios-peripheral --all-features
          -p smallaios-bench
          -- -D warnings

  build-x86_64:
    name: Build x86-64 Kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none
      - run: cargo build --target x86_64-unknown-none -p smallaios-arch-x86_64 $BUILD_STD
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-Tarch/x86_64/linker.ld -C code-model=kernel"

  build-aarch64:
    name: Build AArch64 Kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: aarch64-unknown-none
      - run: cargo build --target aarch64-unknown-none -p smallaios-arch-aarch64 $BUILD_STD
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-Tarch/aarch64/linker.ld"

  build-riscv64:
    name: Build RISC-V Kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: riscv64gc-unknown-none-elf
      - run: cargo build --target riscv64gc-unknown-none-elf -p smallaios-arch-riscv64 $BUILD_STD
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-Tarch/riscv64/linker.ld"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - run: >-
          cargo test
          -p smallaios-kernel
          -p smallaios-security
          -p smallaios-onnx-rt
          -p smallaios-ipc
          -p smallaios-net
          -p smallaios-posix
          -p smallaios-container
          -p smallaios-bus
          -p smallaios-peripheral --all-features
          -p smallaios-bench

  riscv-qemu-smoke:
    name: RISC-V QEMU Smoke Test
    runs-on: ubuntu-latest
    needs: build-riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: riscv64gc-unknown-none-elf
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc
      - name: Build RISC-V kernel
        run: cargo build --release --target riscv64gc-unknown-none-elf -p smallaios-arch-riscv64 $BUILD_STD
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-Tarch/riscv64/linker.ld"
      - name: Boot in QEMU (timeout 30s)
        run: |
          timeout 30 qemu-system-riscv64 \
            -machine virt -cpu rv64 -m 512M -nographic \
            -bios default \
            -kernel target/riscv64gc-unknown-none-elf/release/smallaios-riscv64 \
            -serial stdio 2>&1 | tee boot.log || true
          echo "=== Boot log ==="
          cat boot.log
          echo "=== RISC-V QEMU smoke test completed ==="

  image-size:
    name: Image Size Check (<15 MB)
    runs-on: ubuntu-latest
    needs: [build-x86_64, build-aarch64, build-riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none, aarch64-unknown-none, riscv64gc-unknown-none-elf
      - name: Build all release kernels
        run: |
          RUSTFLAGS="-D warnings -C link-arg=-Tarch/x86_64/linker.ld -C code-model=kernel" \
            cargo build --release --target x86_64-unknown-none -p smallaios-arch-x86_64 $BUILD_STD
          RUSTFLAGS="-D warnings -C link-arg=-Tarch/aarch64/linker.ld" \
            cargo build --release --target aarch64-unknown-none -p smallaios-arch-aarch64 $BUILD_STD
          RUSTFLAGS="-D warnings -C link-arg=-Tarch/riscv64/linker.ld" \
            cargo build --release --target riscv64gc-unknown-none-elf -p smallaios-arch-riscv64 $BUILD_STD
      - name: Check binary sizes
        run: |
          MAX=$((15 * 1024 * 1024))
          fail=0
          for bin in \
            target/x86_64-unknown-none/release/smallaios-x86_64 \
            target/aarch64-unknown-none/release/smallaios-aarch64 \
            target/riscv64gc-unknown-none-elf/release/smallaios-riscv64; do
            if [ -f "$bin" ]; then
              size=$(stat --format=%s "$bin")
              kb=$((size / 1024))
              name=$(basename "$bin")
              echo "$name: ${kb} KB ($(( kb / 1024 )) MB)"
              if [ "$size" -gt "$MAX" ]; then
                echo "FAIL: $name exceeds 15 MB limit"
                fail=1
              fi
            fi
          done
          if [ "$fail" -eq 1 ]; then exit 1; fi
          echo "All binaries within 15 MB limit."

  tla-verify:
    name: TLA+ Formal Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download TLA+ tools
        run: |
          mkdir -p /tmp/tla
          curl -sSL -o /tmp/tla/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: Run TLC on all protocol models
        run: |
          models=(
            CanArbitration
            Arinc429Scheduler
            AfdxVirtualLink
            Mil1553Protocol
            SpaceWireLink
            DdsReliableDelivery
            DdsDiscovery
            QuicFlowControl
            QuicMigration
            BuddyAllocator
            Scheduler
            I2CArbitration
            SPIProtocol
            GPIOInterrupt
            UARTFlowControl
            CSIFrameBuffer
            I2SRingBuffer
          )
          for model in "${models[@]}"; do
            echo "=== Verifying $model ==="
            java -cp /tmp/tla/tla2tools.jar tlc2.TLC \
              formal/tla/${model}.tla \
              -config formal/tla/${model}.cfg \
              -workers auto \
              -deadlock
          done
          echo "All TLA+ models verified."

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: >-
          cargo llvm-cov
          --lcov --output-path lcov.info
          -p smallaios-kernel
          -p smallaios-security
          -p smallaios-onnx-rt
          -p smallaios-ipc
          -p smallaios-net
          -p smallaios-posix
          -p smallaios-container
          -p smallaios-bus
          -p smallaios-peripheral --all-features
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  change-gates:
    name: Change Gates
    runs-on: ubuntu-latest
    needs: [check-format, clippy, test, build-x86_64, build-aarch64, build-riscv64]
    if: github.event_name == 'pull_request'
    steps:
      - name: All gates passed
        run: echo "All change gates passed — PR is mergeable"
