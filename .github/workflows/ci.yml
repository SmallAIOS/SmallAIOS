name: SmallAIOS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC (Miri)
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  BUILD_STD: "-Z build-std=core,compiler_builtins,alloc -Z build-std-features=compiler-builtins-mem"

jobs:
  check-format:
    name: Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: clippy, rust-src
      - run: >-
          cargo clippy
          -p smallaios-kernel
          -p smallaios-security
          -p smallaios-onnx-rt
          -p smallaios-ipc
          -p smallaios-net --features smallaios-net/tegra-net
          -p smallaios-posix
          -p smallaios-container
          -p smallaios-bus
          -p smallaios-peripheral --features smallaios-peripheral/full-peripheral
          -p smallaios-usb
          -p smallaios-sdr
          -p smallaios-bench
          -- -D warnings

  build-x86_64:
    name: Build x86-64 Kernel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none
      - run: cargo build --target x86_64-unknown-none -p smallaios-arch-x86_64 $BUILD_STD
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-Tarch/x86_64/linker.ld -C code-model=kernel"

  build-aarch64:
    name: Build AArch64 Kernel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: aarch64-unknown-none
      - run: cargo build --target aarch64-unknown-none -p smallaios-arch-aarch64 $BUILD_STD
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-Tarch/aarch64/linker.ld"

  build-jetson:
    name: Build Jetson Nano (Tegra X1)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: aarch64-unknown-none
      - run: >-
          cargo build --target aarch64-unknown-none
          -p smallaios-arch-aarch64 --no-default-features --features tegra-x1
          $BUILD_STD
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-Tarch/aarch64/linker-tegra.ld"

  build-riscv64:
    name: Build RISC-V Kernel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: riscv64gc-unknown-none-elf
      - run: cargo build --target riscv64gc-unknown-none-elf -p smallaios-arch-riscv64 $BUILD_STD
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-Tarch/riscv64/linker.ld"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - run: >-
          cargo test
          -p smallaios-kernel
          -p smallaios-security
          -p smallaios-onnx-rt
          -p smallaios-ipc
          -p smallaios-net --features smallaios-net/tegra-net
          -p smallaios-posix
          -p smallaios-container
          -p smallaios-bus
          -p smallaios-peripheral --features smallaios-peripheral/full-peripheral
          -p smallaios-usb
          -p smallaios-sdr
          -p smallaios-bench

  cuda-check:
    name: CUDA Feature Check (cargo check --features cuda)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Cheap gate that catches Send/Sync regressions in the GPU code path.
    # `cargo check` does not link, so we don't need libcudart on the
    # runner — only the Rust toolchain. This unblocks GPU-feature
    # development without requiring a GPU CI host.
    #
    # We do NOT use `--workspace` here because `arch/aarch64` and
    # `arch/riscv64` carry unguarded `core::arch::asm!` blocks that
    # only assemble for their own target_arch. The `Unit Tests` job
    # has the same constraint and uses the same curated-list pattern.
    # The list below covers every workspace crate that touches the
    # `cuda` / `nvidia_gpu` features either directly or via a
    # dependency edge — adding a new crate that imports `cuda::*`
    # means adding it here too.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - name: cargo check --features cuda,nvidia_gpu
        run: |
          cargo check \
            -p smallaios-onnx-rt \
            -p smallaios-container \
            -p smallaios-arch-nvidia \
            -p smallaios-compute \
            --features cuda,nvidia_gpu

  jetson-image-build:
    name: Jetson Image Build (advisory, QEMU)
    runs-on: ubuntu-latest
    # Advisory until a self-hosted Jetson runner is available — there's no way
    # to run a real Tegra runtime test on GitHub-hosted runners. This job
    # at least catches Dockerfile.jetson syntactic / dependency rot under
    # QEMU emulation.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build Dockerfile.jetson under QEMU (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.jetson
          platforms: linux/arm64
          push: false
          load: false
          cache-from: type=gha,scope=jetson
          cache-to: type=gha,mode=max,scope=jetson

  test-formal-gate:
    name: Unit Tests (formal-gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - name: Test with formal-gate enabled
        run: >-
          cargo test
          -p smallaios-security --features formal-gate
          -p smallaios-ipc --features formal-gate
          -p smallaios-onnx-rt --features formal-gate
          -p smallaios-container --features formal-gate
      - name: Test without formal-gate (default)
        run: >-
          cargo test
          -p smallaios-security
          -p smallaios-ipc
          -p smallaios-onnx-rt
          -p smallaios-container

  test-verified-boot:
    name: Unit Tests (verified-boot)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - name: Test with verified-boot enabled
        run: >-
          cargo test
          -p smallaios-kernel --features verified-boot,no-global-alloc
          -p smallaios-security --features verified-boot
          -p smallaios-onnx-rt --features verified-boot
      - name: Clippy with verified-boot enabled
        run: >-
          cargo clippy
          -p smallaios-kernel --features verified-boot,no-global-alloc
          -p smallaios-security --features verified-boot
          -p smallaios-onnx-rt --features verified-boot
          -- -D warnings

  riscv-qemu-smoke:
    name: RISC-V QEMU Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build-riscv64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: riscv64gc-unknown-none-elf
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc
      - name: Build RISC-V kernel
        run: cargo build --release --target riscv64gc-unknown-none-elf -p smallaios-arch-riscv64 $BUILD_STD
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-Tarch/riscv64/linker.ld"
      - name: Boot in QEMU (timeout 30s)
        run: |
          timeout 30 qemu-system-riscv64 \
            -machine virt -cpu rv64 -m 512M -nographic \
            -bios default \
            -kernel target/riscv64gc-unknown-none-elf/release/smallaios-riscv64 \
            -serial stdio 2>&1 | tee boot.log || true
          echo "=== Boot log ==="
          cat boot.log
          echo "=== RISC-V QEMU smoke test completed ==="

  image-size:
    name: Image Size Check (<15 MB)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-x86_64, build-aarch64, build-riscv64, build-jetson]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none, aarch64-unknown-none, riscv64gc-unknown-none-elf
      - name: Build all release kernels
        run: |
          RUSTFLAGS="-D warnings -C link-arg=-Tarch/x86_64/linker.ld -C code-model=kernel" \
            cargo build --release --target x86_64-unknown-none -p smallaios-arch-x86_64 $BUILD_STD
          RUSTFLAGS="-D warnings -C link-arg=-Tarch/aarch64/linker.ld" \
            cargo build --release --target aarch64-unknown-none -p smallaios-arch-aarch64 $BUILD_STD
          RUSTFLAGS="-D warnings -C link-arg=-Tarch/riscv64/linker.ld" \
            cargo build --release --target riscv64gc-unknown-none-elf -p smallaios-arch-riscv64 $BUILD_STD
          RUSTFLAGS="-D warnings -C link-arg=-Tarch/aarch64/linker-tegra.ld" \
            cargo build --release --target aarch64-unknown-none \
            -p smallaios-arch-aarch64 --no-default-features --features tegra-x1 $BUILD_STD
      - name: Check binary sizes
        run: |
          MAX=$((15 * 1024 * 1024))
          fail=0
          for bin in \
            target/x86_64-unknown-none/release/smallaios-x86_64 \
            target/aarch64-unknown-none/release/smallaios-aarch64 \
            target/riscv64gc-unknown-none-elf/release/smallaios-riscv64; do
            if [ -f "$bin" ]; then
              size=$(stat --format=%s "$bin")
              kb=$((size / 1024))
              name=$(basename "$bin")
              echo "$name: ${kb} KB ($(( kb / 1024 )) MB)"
              if [ "$size" -gt "$MAX" ]; then
                echo "FAIL: $name exceeds 15 MB limit"
                fail=1
              fi
            fi
          done
          if [ "$fail" -eq 1 ]; then exit 1; fi
          echo "All binaries within 15 MB limit."

  tla-verify:
    name: TLA+ Formal Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Download TLA+ tools
        run: |
          mkdir -p /tmp/tla
          curl -sSL -o /tmp/tla/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: Run TLC on all protocol models
        run: |
          models=(
            CanArbitration
            Arinc429Scheduler
            AfdxVirtualLink
            Mil1553Protocol
            SpaceWireLink
            DdsReliableDelivery
            DdsDiscovery
            QuicFlowControl
            QuicMigration
            BuddyAllocator
            Scheduler
            I2CArbitration
            SPIProtocol
            GPIOInterrupt
            UARTFlowControl
            CSIFrameBuffer
            I2SRingBuffer
            SecurityGate
            PolicyUpdate
            USBEnumeration
            XhciTransferRing
            IQRingBuffer
          )
          failed=()
          timed_out=()
          for model in "${models[@]}"; do
            echo "=== Verifying $model ==="
            set +e
            timeout 300 java -Xmx4g -cp /tmp/tla/tla2tools.jar tlc2.TLC \
              formal/tla/${model}.tla \
              -config formal/tla/${model}.cfg \
              -workers auto \
              -deadlock
            rc=$?
            set -e
            if [ $rc -eq 124 ]; then
              echo "WARNING: $model timed out (5 min limit) — state space too large for CI"
              timed_out+=("$model")
            elif [ $rc -ne 0 ]; then
              echo "FAIL: $model verification failed (exit code $rc)"
              failed+=("$model")
            else
              echo "OK: $model verified"
            fi
          done
          echo ""
          echo "=== TLA+ Summary ==="
          echo "Timed out (${#timed_out[@]}): ${timed_out[*]:-none}"
          echo "Failed (${#failed[@]}): ${failed[*]:-none}"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "FAIL: ${#failed[@]} model(s) had verification errors"
            exit 1
          fi
          echo "All TLA+ models verified or bounded by timeout."

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src, llvm-tools
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate per-crate coverage reports
        run: |
          CRATES=(kernel security onnx-rt ipc net posix container bus peripheral usb sdr)
          EXTRA_FLAGS=""
          for crate in "${CRATES[@]}"; do
            pkg="smallaios-${crate}"
            outfile="lcov-${crate}.info"
            flags=""
            if [ "$crate" = "peripheral" ]; then
              flags="--features smallaios-peripheral/full-peripheral"
            fi
            cargo llvm-cov --lcov --output-path "$outfile" -p "$pkg" $flags
          done
      - name: Upload per-crate coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-kernel.info
          flags: kernel
          fail_ci_if_error: false
      - name: Upload security coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-security.info
          flags: security
          fail_ci_if_error: false
      - name: Upload onnx-rt coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-onnx-rt.info
          flags: onnx-rt
          fail_ci_if_error: false
      - name: Upload net coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-net.info
          flags: net
          fail_ci_if_error: false
      - name: Upload ipc coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-ipc.info
          flags: ipc
          fail_ci_if_error: false
      - name: Upload container coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-container.info
          flags: container
          fail_ci_if_error: false
      - name: Upload bus coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-bus.info
          flags: bus
          fail_ci_if_error: false
      - name: Upload peripheral coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-peripheral.info
          flags: peripheral
          fail_ci_if_error: false
      - name: Upload usb coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-usb.info
          flags: usb
          fail_ci_if_error: false
      - name: Upload sdr coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-sdr.info
          flags: sdr
          fail_ci_if_error: false
      - name: Upload posix coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-posix.info
          flags: posix
          fail_ci_if_error: false
      - name: Merge all coverage for SonarCloud
        run: cat lcov-*.info > lcov.info
      - name: Convert LCOV to SonarCloud generic format
        run: python3 scripts/lcov-to-sonar.py lcov.info > sonar-coverage.xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-sonar
          path: sonar-coverage.xml
          retention-days: 1

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    needs: coverage
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-sonar
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build-local:
    name: Docker Build (Local)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image (CPU-only)
        run: docker build -t smallaios:ci-test .
      - name: Check image size
        run: |
          size=$(docker image inspect smallaios:ci-test --format='{{.Size}}')
          max=$((15 * 1024 * 1024))
          mb=$(( size / 1024 / 1024 ))
          echo "Docker image size: ${mb} MB (${size} bytes)"
          if [ "$size" -gt "$max" ]; then
            echo "FAIL: Docker image exceeds 15 MB"
            exit 1
          fi
          echo "PASS: Docker image within 15 MB limit"

  docker-build-arm64:
    name: Docker Build (ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ARM64 container image
        run: docker buildx build --platform linux/arm64 -t smallaios:arm64-ci --load .
      - name: Verify image architecture
        run: |
          arch=$(docker image inspect smallaios:arm64-ci --format='{{.Architecture}}')
          echo "Image architecture: ${arch}"
          if [ "$arch" != "arm64" ]; then
            echo "FAIL: expected arm64, got ${arch}"
            exit 1
          fi
          echo "PASS: ARM64 image built successfully"
      - name: Check image size
        run: |
          size=$(docker image inspect smallaios:arm64-ci --format='{{.Size}}')
          max=$((15 * 1024 * 1024))
          mb=$(( size / 1024 / 1024 ))
          echo "Docker image size: ${mb} MB (${size} bytes)"
          if [ "$size" -gt "$max" ]; then
            echo "FAIL: Docker image exceeds 15 MB"
            exit 1
          fi
          echo "PASS: ARM64 Docker image within 15 MB limit"
      - name: Smoke test ARM64 container (health check)
        run: |
          docker run --rm -d --name arm64-smoke -p 8080:8080 smallaios:arm64-ci
          sleep 3
          response=$(curl -sf http://localhost:8080/healthz || echo "FAIL")
          docker stop arm64-smoke || true
          echo "Health response: ${response}"
          if echo "$response" | grep -q "healthy"; then
            echo "PASS: ARM64 container health check passed"
          else
            echo "FAIL: ARM64 container health check failed"
            exit 1
          fi

  docker-build-gpu:
    name: Docker Build (GPU)
    runs-on: ubuntu-latest
    # GPU Docker build requires NVIDIA CUDA devel base image (~5 GB pull).
    # Only runs on manual dispatch or scheduled — too slow for every PR.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build GPU Dockerfile (full build)
        run: docker build -f Dockerfile.cuda -t smallaios:gpu-ci .
      - name: Verify GPU image built
        run: |
          arch=$(docker image inspect smallaios:gpu-ci --format='{{.Architecture}}')
          echo "GPU image architecture: ${arch}"
          echo "PASS: GPU Dockerfile builds successfully"

  semver-check:
    name: Semver PR Title Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate PR title follows conventional commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bump=$(./scripts/check-pr-semver.sh "$PR_TITLE")
          echo "PR title: $PR_TITLE"
          echo "Semver bump: $bump"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
      - name: Add semver label
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const labels = ['semver:major', 'semver:minor', 'semver:patch', 'semver:none'];
            // Remove old semver labels
            for (const label of labels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label,
                });
              } catch (e) { /* label not present */ }
            }
            // Determine bump from title
            const breakingRe = /^(feat|fix|docs|chore|ci|test|refactor|style|perf|build|revert)(\([a-z0-9_/ -]+\))?!:/;
            const typeRe = /^(feat|fix|docs|chore|ci|test|refactor|style|perf|build|revert)/;
            const match = title.match(typeRe);
            if (!match) return;
            const type = match[1];
            const breaking = breakingRe.test(title);
            let bump;
            if (breaking) bump = 'minor'; // pre-1.0: breaking = minor
            else if (type === 'feat') bump = 'minor';
            else if (['fix', 'perf', 'revert'].includes(type)) bump = 'patch';
            else bump = 'none';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [`semver:${bump}`],
            });

  cargo-deny:
    name: Supply Chain Security (cargo-deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  cargo-geiger:
    name: Unsafe Usage Report (cargo-geiger)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked || true
      - name: Generate unsafe usage report
        run: |
          cargo geiger --all-features --output-format ascii 2>&1 | tee geiger-report.txt || true
          echo "=== Unsafe Usage Summary ==="
          grep -c "unsafe" geiger-report.txt || echo "0 unsafe usages found"
      - name: Upload geiger report
        uses: actions/upload-artifact@v7
        with:
          name: geiger-report
          path: geiger-report.txt
          retention-days: 30

  check-cycles:
    name: Cyclic Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
      - name: Check for cyclic dependencies
        run: ./scripts/check-cycles.sh

  kani-verify:
    name: Kani Model Checking
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Run Kani proofs (kernel)
        run: cargo kani -p smallaios-kernel --tests 2>&1 | tee kani-kernel.txt || true
      - name: Run Kani proofs (security)
        run: cargo kani -p smallaios-security --tests 2>&1 | tee kani-security.txt || true
      - name: Upload Kani reports
        uses: actions/upload-artifact@v7
        with:
          name: kani-reports
          path: kani-*.txt
          retention-days: 30

  spin-verify:
    name: SPIN Model Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Install SPIN
        run: |
          sudo apt-get update
          sudo apt-get install -y spin || {
            # Build from source if package unavailable
            git clone https://github.com/nimble-code/Spin.git /tmp/spin-src
            cd /tmp/spin-src/Src
            make
            sudo cp spin /usr/local/bin/
          }
      - name: Verify all Promela models
        run: |
          failed=()
          timed_out=()
          for model in formal/spin/*.pml formal/promela/*.pml; do
            [ -f "$model" ] || continue
            name=$(basename "$model" .pml)
            echo "=== Verifying $name ==="
            set +e

            # Generate verifier
            spin -a "$model" 2>&1
            if [ $? -ne 0 ]; then
              echo "WARNING: $name failed to generate verifier (syntax error?)"
              failed+=("$name")
              rm -f pan.* *.trail
              continue
            fi

            # Compile verifier
            cc -DMEMLIM=1024 -DVECTORSZ=4096 -o pan pan.c 2>&1
            if [ $? -ne 0 ]; then
              echo "WARNING: $name failed to compile verifier"
              failed+=("$name")
              rm -f pan.* *.trail
              continue
            fi

            # Run verification with 5 min timeout
            timeout 300 ./pan -a 2>&1
            rc=$?
            set -e

            if [ $rc -eq 124 ]; then
              echo "WARNING: $name timed out (5 min limit)"
              timed_out+=("$name")
            elif [ $rc -ne 0 ]; then
              echo "FAIL: $name verification found errors (exit $rc)"
              failed+=("$name")
            else
              echo "OK: $name verified"
            fi
            rm -f pan.* *.trail
          done

          echo ""
          echo "=== SPIN Summary ==="
          echo "Timed out (${#timed_out[@]}): ${timed_out[*]:-none}"
          echo "Failed (${#failed[@]}): ${failed[*]:-none}"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "WARNING: ${#failed[@]} model(s) had issues"
          fi
          echo "SPIN verification complete."

  mutation-testing:
    name: Mutation Testing (on-demand)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run mutation testing on crypto
        run: |
          cargo mutants -p smallaios-security --file security/src/crypto/constant_time.rs -- --lib 2>&1 | tee mutants-crypto.txt || true
      - name: Run mutation testing on memory
        run: |
          cargo mutants -p smallaios-kernel --file kernel/src/mem/buddy.rs --file kernel/src/mem/slab.rs -- --lib 2>&1 | tee mutants-memory.txt || true
      - name: Upload mutation reports
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: mutants-*.txt
          retention-days: 30

  miri:
    name: Miri UB Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: miri, rust-src
      - name: Run Miri on host-testable crates
        run: >-
          cargo miri test
          -p smallaios-kernel
          -p smallaios-security
          -p smallaios-ipc
          -p smallaios-net
          -p smallaios-posix
          -p smallaios-bus
          -p smallaios-bench
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz targets (60s each)
        run: |
          targets=(fuzz_onnx_protobuf fuzz_tcp_packet fuzz_udp_packet fuzz_usb_descriptor fuzz_ipc_message fuzz_onnx_tensor)
          failed=()
          for target in "${targets[@]}"; do
            echo "=== Fuzzing $target ==="
            set +e
            cargo fuzz run "$target" -- -max_total_time=60 2>&1
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              echo "FAIL: $target found a crash"
              failed+=("$target")
            else
              echo "OK: $target completed"
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "FAIL: ${#failed[@]} fuzz target(s) found crashes: ${failed[*]}"
            exit 1
          fi
          echo "All fuzz targets completed without crashes."

  bench:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - name: Run benchmarks
        run: cargo bench -p smallaios-bench
      - name: Check for regressions
        run: ./scripts/bench-regression.sh 10
        continue-on-error: true
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: target/criterion/
          retention-days: 30

  dependency-analysis:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install analysis tools
        run: |
          cargo install cargo-depgraph --locked
          cargo install cargo-modules --locked
          sudo apt-get update && sudo apt-get install -y graphviz
      - name: Generate crate-level dependency graph
        run: just depgraph
      - name: Module-level acyclicity check
        continue-on-error: true
        run: just arch-check
      - name: Generate DSM matrix
        run: just dsm
      - name: Run DSM analysis
        run: just dsm-analyze
        continue-on-error: true
      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dependency-analysis
          path: build/analysis/
          retention-days: 30

  # --- Safety-Critical Tooling ---

  semver-api-check:
    name: API Semver Check (cargo-semver-checks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check for API breakage
        id: semver
        continue-on-error: true
        run: |
          cargo semver-checks check-release \
            --baseline-rev origin/${{ github.base_ref }} \
            -p smallaios-kernel \
            -p smallaios-security \
            -p smallaios-onnx-rt \
            -p smallaios-net \
            -p smallaios-ipc \
            -p smallaios-posix \
            -p smallaios-container \
            2>&1 | tee semver-report.txt
      - name: Gate or warn based on PR title
        if: steps.semver.outcome == 'failure'
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if echo "$PR_TITLE" | grep -q '!'; then
            echo "::warning::API breaking changes detected — allowed because PR title contains '!'"
            echo "Breaking changes are intentional per semver convention."
          else
            echo "::error::API breaking changes detected but PR title does not contain '!'"
            echo "Either fix the breaking change or add '!' to the PR title (e.g., feat!: rename API)"
            cat semver-report.txt
            exit 1
          fi
      - name: Upload semver report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semver-api-report
          path: semver-report.txt
          retention-days: 30

  cargo-vet-check:
    name: Dependency Audit (cargo-vet)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked
      - name: Check dependency audits
        run: cargo vet check

  careful-test:
    name: Careful UB Testing (cargo-careful)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: rust-src
      - name: Install cargo-careful
        run: cargo install cargo-careful --locked
      - name: Run careful tests
        run: |
          cargo careful test \
            -p smallaios-kernel \
            -p smallaios-security \
            -p smallaios-onnx-rt \
            -p smallaios-ipc \
            -p smallaios-net \
            -p smallaios-posix \
            -p smallaios-container \
            -p smallaios-bus \
            -p smallaios-bench \
            2>&1 | tee careful-report.txt
      - name: Upload careful report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: careful-report
          path: careful-report.txt
          retention-days: 30

  coverage-threshold:
    name: Coverage Threshold (80%)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-02-01
          components: llvm-tools
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Check coverage threshold
        # Threshold ratcheting schedule:
        #   80% — initial (2026-04-05)
        #   85% — after onnx-cpu-runtime-v1 tests complete
        #   90% — after cpu-parallel-inference-v1
        #   93% — parity with Codecov target
        run: |
          cargo llvm-cov \
            --fail-under-lines 80 \
            -p smallaios-kernel \
            -p smallaios-security \
            -p smallaios-onnx-rt \
            -p smallaios-ipc \
            -p smallaios-net \
            -p smallaios-posix \
            -p smallaios-container \
            -p smallaios-bus \
            -p smallaios-bench \
            2>&1 | tee coverage-threshold.txt
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-threshold-report
          path: coverage-threshold.txt
          retention-days: 30

  change-gates:
    name: Change Gates
    runs-on: ubuntu-latest
    permissions: {}
    needs: [check-format, clippy, test, test-formal-gate, cuda-check, build-x86_64, build-aarch64, build-riscv64, build-jetson, docker-build-local, semver-check, cargo-deny, check-cycles, semver-api-check, coverage-threshold]
    if: github.event_name == 'pull_request'
    steps:
      - name: All gates passed
        run: echo "All change gates passed — PR is mergeable"
