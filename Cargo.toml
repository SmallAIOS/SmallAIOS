[workspace]
resolver = "2"
members = [
    "kernel",
    "compute",
    "arch/x86_64",
    "arch/aarch64",
    "arch/riscv64",
    "arch/nvidia",
    "arch/intel_gpu",
    "arch/amd",
    "arch/apple",
    "onnx-rt",
    "ipc",
    "net",
    "posix",
    "security",
    "container",
    "bus",
    "peripheral",
    "usb",
    "sdr",
    "bench",
    "sched-types",
    "auth",
    "mgmt",
    "fs",
    "tools/coverage-probe",
    "xtask",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SmallAIOS/SmallAIOS"
homepage = "https://github.com/SmallAIOS/SmallAIOS"
description = "Minimal, secure OS kernel for AI inference workloads"
keywords = ["os", "kernel", "onnx", "inference", "unikernel"]
categories = ["os", "no-std", "embedded"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
