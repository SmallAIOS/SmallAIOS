[workspace]
resolver = "2"
members = [
    "kernel",
    "arch/x86_64",
    "arch/aarch64",
    "arch/nvidia",
    "onnx-rt",
    "ipc",
    "net",
    "posix",
    "security",
    "container",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
