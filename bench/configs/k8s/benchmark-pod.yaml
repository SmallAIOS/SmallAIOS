apiVersion: v1
kind: Pod
metadata:
  name: onnxrt-bench
  labels:
    app: smallaios-bench
spec:
  restartPolicy: Never
  containers:
    - name: onnxrt
      image: mcr.microsoft.com/onnxruntime/server:latest
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "2"
          memory: "2Gi"
        limits:
          cpu: "4"
          memory: "4Gi"
      volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: models
      hostPath:
        path: /opt/smallaios-bench/models
        type: DirectoryOrCreate
