[package]
name = "smallaios-mgmt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed configuration model, ConfigSurface trait, and audit ring for SmallAIOS"
publish = false

[dependencies]
# Layer 1 — depends on auth (Layer 1, peer), security + kernel (Layer 0).
# Reuses ipc-zenoh for the remote management surface.
smallaios-auth = { path = "../auth" }
smallaios-security = { path = "../security" }
smallaios-kernel = { path = "../kernel" }

[dev-dependencies]
# Dev-only "oracle" used by mgmt/tests/toml_oracle.rs to cross-check
# our clean-room TOML parser against the upstream `toml` crate. Only
# pulled in for `cargo test` — production builds (kernel + container)
# do NOT depend on this crate.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[features]
default = []
# Build-time wiring per `management-login-v1` design:
# - `bus-zenoh`: enable Zenoh-backed admin/telemetry surfaces.
# - `bus-dds`: enable DDS-backed admin (placeholder).
# - `formal-gate`: formal verification gates for CI.
# - `signed-checkpoints`: ML-DSA-65 signed audit-log checkpoints.
# - `mgmt-token-mldsa`: opt-in ML-DSA-65 signed JWT-style tokens
#   (Phase 7 — opaque random tokens remain the default; this feature
#   adds an additional path, it does not disable opaque tokens).
# - `mgmt-token-ed25519-legacy`: opt-in Ed25519 signed JWT-style tokens
#   for legacy clients. Off by default, and when off NO Ed25519 code
#   from `surface_zenoh::token::ed25519_legacy` SHALL be linked into
#   the binary (compile-time excluded under
#   `#[cfg(feature = "mgmt-token-ed25519-legacy")]`).
bus-zenoh = []
bus-dds = []
formal-gate = []
signed-checkpoints = []
mgmt-token-mldsa = []
mgmt-token-ed25519-legacy = []
