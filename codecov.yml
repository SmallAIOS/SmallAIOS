codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "40...90"

  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 70%

ignore:
  - "arch/**"
  - "target/**"
  - "formal/**"
  - "openspec/**"
  - "deploy/**"
  - "kubelet/**"
  - "bench/**"
