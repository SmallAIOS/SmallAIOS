[package]
name = "smallaios-container"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SmallAIOS container interface: health checks, metrics, orchestration"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(smallaios_unikernel)'] }

[features]
default = []
nvidia_gpu = ["smallaios-arch-nvidia"]
cuda = ["smallaios-onnx-rt/cuda"]
# Enables detection + loading of HuggingFace safetensors model
# directories alongside `.onnx` files. Meaningful forward-pass
# inference additionally requires the `cuda` feature (the safetensors
# Session is strictly GPU-resident).
safetensors = ["smallaios-onnx-rt/safetensors"]
formal-gate = ["smallaios-security/formal-gate"]
# Bus/dataflow runner feature flags. Placeholders until `smallaios-ipc`
# ships the `onnx` feature and the `DataflowRunner` module — see
# openspec/changes/dataflow-inference-v1 task groups 1-4.
bus-zenoh = []
bus-dds = []
# Verifiable audit-log export via immudb (verifiable-audit-log-v1).
# Off by default — when enabled, the binary links the audit-export
# crate and gains the `container::audit_export_runtime` module that
# implements the StateStore + config-loader glue. D10 Layer 1 of
# the design.md verifies the no-feature build links zero exporter
# code (cargo bloat shows no audit-export symbols).
audit-export = [
    "dep:smallaios-audit-export",
    "dep:smallaios-tls-client",
    "smallaios-net/http2",
]

[dependencies]
smallaios-kernel = { path = "../kernel", features = ["no-global-alloc"] }
smallaios-onnx-rt = { path = "../onnx-rt", features = ["std"] }
smallaios-ipc = { path = "../ipc", features = ["onnx"] }
smallaios-bus = { path = "../bus", default-features = false, features = ["can"] }
smallaios-posix = { path = "../posix" }
smallaios-security = { path = "../security" }
smallaios-net = { path = "../net" }
smallaios-audit-export = { path = "../audit-export", optional = true }
# `std` pulls in the std_io adapter (`TcpTlsStream`) that the
# audit-export transport drives; the tls-client core stays no_std.
smallaios-tls-client = { path = "../tls-client", optional = true, features = [
    "std",
] }
smallaios-arch-nvidia = { path = "../arch/nvidia", optional = true }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# `test-harness` exposes the mock TLS 1.3 server the transport
# tests drive a full handshake against (tls-tcp-client-v1 task
# 8.3). Test builds only — `cargo build` never sees this.
smallaios-tls-client = { path = "../tls-client", features = [
    "std",
    "test-harness",
] }
