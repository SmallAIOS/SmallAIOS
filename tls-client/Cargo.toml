[package]
name = "smallaios-tls-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TLS 1.3 over TCP client for SmallAIOS — clean-room `#![no_std]`"
publish = false

# Layer 1 — Core Service. Depends on Layer 0 only.
# See openspec/changes/tls-tcp-client-v1/design.md for the
# decisions backing this crate.

[dependencies]
smallaios-security = { path = "../security" }
smallaios-kernel = { path = "../kernel" }

[features]
default = []
# Enables the std-IO adapter (`std_io::TcpTlsStream`) that drives the
# handshake over a real TCP socket. Off for the bare-metal kernel
# build; the `container` crate turns it on. The crate core stays
# `#![no_std]`; only the `std_io` module pulls `std`.
std = []
# Operator-facing knob for the deferred mTLS path.
mtls = []
formal-gate = []
# Exposes the mock TLS 1.3 server (`harness` module) that this
# crate's own tests drive the client against, so downstream crates
# can run full-handshake tests through their production seams
# (`container`'s audit-export transport does). Dev-dependencies
# only — enabling it in a production build ships dead test code.
test-harness = []

# Real-endpoint e2e (task 7.6): #[ignore]-gated, needs the std-IO
# adapter. `cargo test` without `--features std` skips the target.
[[test]]
name = "e2e"
required-features = ["std"]
