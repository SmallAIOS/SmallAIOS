# cargo-deny configuration for SmallAIOS
# Run: cargo deny check
# SPDX-License-Identifier: Apache-2.0

[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

# Advisory database — deny all known vulnerabilities
[advisories]
ignore = []

# License compliance — allow-list only
[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# Ban rules — no GPL/LGPL/AGPL in transitive deps
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# C/C++ crypto libraries are banned at any layer: SmallAIOS crypto is
# clean-room #![no_std] Rust validated against official vector corpora.
# See docs/crypto-validation.md for the policy, rationale (memory safety,
# licensing, FIPS operational-environment boundaries, DO-178C evidence),
# and the revisit triggers. Spec: crypto-validation-policy.
deny = [
    { crate = "openssl", reason = "C crypto banned — docs/crypto-validation.md" },
    { crate = "openssl-sys", reason = "C crypto banned — docs/crypto-validation.md" },
    { crate = "wolfssl", reason = "C crypto banned — docs/crypto-validation.md" },
    { crate = "wolfssl-sys", reason = "C crypto banned — docs/crypto-validation.md" },
    { crate = "boring", reason = "C crypto banned — docs/crypto-validation.md" },
    { crate = "boring-sys", reason = "C crypto banned — docs/crypto-validation.md" },
    { crate = "mbedtls", reason = "C crypto banned — docs/crypto-validation.md" },
    { crate = "mbedtls-sys-auto", reason = "C crypto banned — docs/crypto-validation.md" },
    { crate = "libsodium-sys", reason = "C crypto banned — docs/crypto-validation.md" },
    { crate = "sodiumoxide", reason = "C crypto banned — docs/crypto-validation.md" },
]

# Sources — crates.io only for production deps
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
