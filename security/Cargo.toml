[package]
name = "smallaios-security"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SmallAIOS security: capabilities, PQC crypto, audit, compliance"
publish = false

[features]
default = ["pqc-hybrid"]
pqc-hybrid = []     # X25519+ML-KEM-768, Ed25519+ML-DSA-65
pqc-only = []       # ML-KEM-768, ML-DSA-65 (no classical)
classical-only = [] # X25519, Ed25519 (no PQC — not recommended)
formal-gate = []    # Formal methods firewall: verified message types at trust boundaries
verified-boot = []  # Boot integrity verification: kernel self-hash, model signature enforcement

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dev-dependencies]
smallaios-net = { path = "../net", features = ["quic"] }
# Validation oracles for clean-room crypto. These crates MUST NOT enter the
# production dep graph — they are only used in #[cfg(test)] KAT comparison
# tests for Blake2b (RFC 7693) and Argon2id (RFC 9106).
blake2 = "0.11"
argon2 = "0.5"

[dependencies]
