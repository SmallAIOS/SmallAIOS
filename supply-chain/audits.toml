[[audits.serde_json]]
who = "Evan Montgomery-Recht <montge@mianetworks.net>"
criteria = "safe-to-run"
delta = "1.0.150 -> 1.0.151"
notes = "Delta review (full source diff, by Claude session 2026-07-25, approved workflow; reviewed then independently re-verified by a second adversarial pass). Package hash c841b55ecdae098c80dcae9cf767f6f8a0c2cdb3416bbef72181df4d0fe73f14 matches the crates.io index. 8 files changed; no files added or removed; build.rs byte-identical; dependency table unchanged. The deserializer, serializer, parser, number and value modules are all untouched — there is no quietly-folded security fix. Sole shipped-code change: src/raw.rs adds a new public `unsafe fn RawValue::from_string_unchecked(String) -> Box<Self>` which skips the re-parse that from_string performs. Its safety contract is enforced only by a debug_assert!, so in release builds a malformed string is written verbatim into any document embedding the RawValue — a JSON-injection primitive if a caller passes attacker-controlled input. The existing unsafe blocks are unchanged (still the same three transmutes); what is added is an unsafe contract, not widened unsafe usage. Note the debug_assert is also stricter than the documented contract: it routes through the deserializer's 128-level depth limit, so deeply-nested but valid JSON panics in debug and passes in release. Not currently reachable in this workspace: the whole raw module is gated behind the non-default `raw_value` feature, which nothing here enables (verified with cargo tree -e features). Remaining delta is CI action version bumps, html_root_url, the crate-internal dev Cargo.lock, and two new tests."
