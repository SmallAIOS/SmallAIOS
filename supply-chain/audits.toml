
# cargo-vet audits file

[[audits.crossbeam-epoch]]
who = "Evan Montgomery-Recht <montge@mianetworks.net>"
criteria = "safe-to-run"
delta = "0.9.18 -> 0.9.20"
notes = "Delta review (full source diff, by Claude session 2026-07-16, approved workflow): fixes RUSTSEC-2026-0204 — fmt::Pointer for Atomic/Shared now formats the raw pointer value without dereferencing it (unsound T::deref removed, format_null regression tests added). Also: Atomic::fetch_update returns prev on success (#1197), epoch counters widen to AtomicU64 where target_has_atomic=64 (#1230), defer_destroy accepts unsized Pointable (#1201), ThreadSanitizer fence workaround gated behind crossbeam_sanitize_thread cfg (#998). New build.rs only reads CARGO_CFG_SANITIZE and emits rustc-check-cfg/rustc-cfg; no new dependencies, no network or filesystem access, test-only changes elsewhere."

[[audits.libc]]
who = "Evan Montgomery-Recht <montge@mianetworks.net>"
criteria = "safe-to-deploy"
delta = "0.2.186 -> 0.2.189"
notes = "Delta review (full source diff, by Claude session 2026-07-25, approved workflow; reviewed then independently re-verified by a second adversarial pass). Spans three upstream releases, 181 files. Soundness fix: extern_ty! changes DIR/FILE/fpos_t/timezone from uninhabited enums to #[repr(C)] ZST structs carrying PhantomData<(*mut u8, PhantomPinned)>, which correctly drops auto Send/Sync and !Unpin for these opaque FFI types. One new unsafe block in src/types.rs (mem::transmute::<&[u8], &[c_char]>) guarded by a size_of assert; unsafe blocks 94 -> 96, unsafe impls 2 -> 10. New public seccomp user-notification ioctl constants and seccomp_notif* structs on Linux/Android — encodings checked against uapi/linux/seccomp.h. PTRACE_SET/GET_SYSCALL_USER_DISPATCH_CONFIG constants were previously truncated to 16/17, aliasing PTRACE_ATTACH/PTRACE_DETACH; now corrected — this fixes a latent misuse hazard rather than introducing one. No new dependencies, no network or filesystem access in shipped code. DISCLOSURE: 0.2.189 adds a new top-level etc/ directory to the published tarball containing etc/libc-util.py (1112 lines, mode 0755) which imports subprocess/multiprocessing and drives gh/git/rustup/cargo. Cargo.toml's exclude list does not cover etc/, so it ships to every consumer. Neither build.rs nor Cargo.toml references it, so it is inert during cargo build; it is upstream maintainer tooling, not a build step. Recorded here because a DAL A supply-chain trail should note an executable script entering the dependency tree even when it is never invoked."

