# SmallAIOS Local Development
# CPU:  docker compose up --build
# GPU:  docker compose --profile gpu up --build

services:
  smallaios:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    environment:
      - SMALLAIOS_MODEL_DIR=/models
      - SMALLAIOS_PORT=8080
      - SMALLAIOS_GPU_BACKEND=cpu
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  smallaios-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_GPU: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - SMALLAIOS_MODEL_DIR=/models
      - SMALLAIOS_PORT=8080
      - SMALLAIOS_GPU_BACKEND=nvidia
    profiles:
      - gpu
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
